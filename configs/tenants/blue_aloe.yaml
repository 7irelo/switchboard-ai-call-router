  payments_arrears: policy_admin
  account_admin: policy_admin
  sales_new: front_desk
  sales_upgrade: policy_admin
  cancel: policy_admin
  tech_support: front_desk
  outage_fault: front_desk
  appointment_book: front_desk
  appointment_change: front_desk
  order_status: claims
  complaint: front_desk
  hours_location: front_desk
  speak_to_human: front_desk
  wrong_number: front_desk
  out_of_scope: front_desk
  emergency: assist_24h
custom_intents:
  - id: claims_new
    description: "The caller wants to lodge a new insurance claim for a loss that has already happened."
    examples: ["someone broke into my car last night and I need to claim", "ngifuna ukufaka i-claim yemoto yami"]
    department: claims
languages: [en, af, zu]
prompt_override: "A short-term insurance broker. A crash scene or fire happening now is an emergency; lodging a claim afterwards is claims_new."
fallback: { department: assist_24h, dtmf_menu: { "1": front_desk, "2": policy_admin, "3": claims, "9": assist_24h } }
