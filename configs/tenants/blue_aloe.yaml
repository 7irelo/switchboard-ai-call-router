# Fictional. Stress: claims emergencies; custom intent handled through the LLM path.
tenant: blue_aloe
name: Blue Aloe Cover Brokers (fictional)
timezone: Africa/Johannesburg
channels: { dids: ["27005550105"], whatsapp_phone_number_ids: ["wa-bluealoe-01"] }
schedules:
  office: { mon: [["08:30", "17:00"]], tue: [["08:30", "17:00"]], wed: [["08:30", "17:00"]], thu: [["08:30", "17:00"]], fri: [["08:30", "16:00"]] }
holidays: ["2026-12-25", "2027-01-01"]
departments:
  - { id: front_desk, target: bluealoe-front, hours: office, closed_action: voicemail }
  - { id: policy_admin, target: bluealoe-policy, hours: office, closed_action: voicemail }
  - { id: claims, target: bluealoe-claims, hours: office, closed_action: voicemail }
  - { id: assist_24h, target: bluealoe-assist, hours: always, closed_action: voicemail, emergency_capable: true }
intent_map:
