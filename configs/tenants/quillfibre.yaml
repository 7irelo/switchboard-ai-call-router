# Fictional. Stress: tech support vs outage, upgrades vs cancels.
tenant: quillfibre
name: Quillfibre Internet (fictional)
timezone: Africa/Johannesburg
channels: { dids: ["27005550103"], whatsapp_phone_number_ids: ["wa-quillfibre-01"] }
schedules:
  sales_hours: { mon: [["08:00", "20:00"]], tue: [["08:00", "20:00"]], wed: [["08:00", "20:00"]], thu: [["08:00", "20:00"]], fri: [["08:00", "20:00"]], sat: [["09:00", "14:00"]] }
departments:
  - { id: frontline, target: quillfibre-frontline, hours: always, closed_action: voicemail }
  - { id: sales, target: quillfibre-sales, hours: sales_hours, closed_action: voicemail }
  - { id: retention, target: quillfibre-retention, hours: sales_hours, closed_action: reception }
  - { id: billing_team, target: quillfibre-billing, hours: sales_hours, closed_action: voicemail }
  - { id: noc, target: quillfibre-noc, hours: always, closed_action: voicemail, emergency_capable: true }
intent_map:
  billing: billing_team
  payments_arrears: billing_team
  account_admin: billing_team
  sales_new: sales
  sales_upgrade: sales
  cancel: retention
  tech_support: frontline
  outage_fault: noc
  appointment_book: frontline
  appointment_change: frontline
  order_status: sales
  complaint: retention
  hours_location: frontline
  speak_to_human: frontline
  wrong_number: frontline
  out_of_scope: frontline
  emergency: noc
languages: [en, af]
prompt_override: "A fibre internet provider. Damaged cables that endanger people are emergencies."
fallback: { department: frontline, dtmf_menu: { "1": sales, "2": frontline, "3": billing_team, "9": noc } }

# The receptionist agent: answers 27005550203. All facts are fictional.
agent:
  enabled: true
  name: Colin
  voice: flux-colin-en
  greeting: "Quillfibre Internet, Colin speaking. How can I help?"
  extensions: ["27005550203"]
  caller_id_name: Quillfibre Internet
  caller_id_number: "27005550203"
  department_notes:
    frontline: "technical support for a single connection, router problems and slow speeds"
    sales: "new connections and upgrades"
    retention: "cancellations and anyone thinking of leaving"
    billing_team: "invoices, payments and refunds"
    noc: "area-wide outages and damaged cables that could hurt someone"
  knowledge: |
    Quillfibre sells home fibre internet. Packages: 50 megabits for R449 a month, 200 megabits for R749, and 1 gigabit for R1099. All uncapped, month to month, with a free router.
    Installation takes five to ten working days after an order, and is free.
    Common fixes: if the internet is down, first switch the router off at the wall for thirty seconds and back on. If the red light on the fibre box is on, it's a line fault for the support team.
    Upgrades take effect within one working day. Cancellations need one calendar month's notice.
    Debit orders run on the 1st of each month. Invoices are emailed on the 25th.
    Sales and billing are available weekdays 08:00 to 20:00 and Saturdays 09:00 to 14:00. Technical support is available all day, every day.
