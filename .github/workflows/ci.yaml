name: ci
on:
  push:
  pull_request:

jobs:
  t0-t1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --python 3.12
      # Runs lint, unit and isolation tests, golden vectors, the fixture eval and the gate's self-test.
      - run: uv run poe ci
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - run: buf lint

  t1-stack:
    # Real SIP calls through Asterisk, the webhook path, canary scans and failure injection.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --python 3.12
      - run: |
          python3 - <<'EOF'
          import secrets
          names = ["POSTGRES_PASSWORD", "SWITCHBOARD_APP_PASSWORD", "ASTERISK_ARI_PASSWORD", "INFERENCE_CONTEXT_SECRET", "WHATSAPP_APP_SECRET", "SWITCHBOARD_ADMIN_KEY", "REDIS_PASSWORD"]
          open(".env", "w").write("".join(f"{n}={secrets.token_hex(24)}\n" for n in names))
          EOF
      - run: mkdir -p deploy/prompts && uv run poe stack-up
      - run: uv run poe seed
      - run: uv run poe e2e
      - run: uv run poe failure
      - if: failure()
        run: docker compose -f deploy/compose.yaml --env-file .env logs --no-color --tail 200

  mutation:
    # Slow, so it runs on main only. A surviving mutant fails the build.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --python 3.12
      - run: uv run poe mutation
