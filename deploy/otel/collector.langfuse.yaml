# Sends spans to self-hosted Langfuse over OTLP HTTP. One project, with tenants separated by tags:
# a weaker boundary than the per-tenant file sinks in collector.yaml, so anyone with this project's
# access can see every tenant's traces. Transcripts are never span attributes, so they aren't in there.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  batch:
    timeout: 1s
exporters:
  otlphttp/langfuse:
    endpoint: http://langfuse-web:3000/api/public/otel
    headers:
      Authorization: Basic ${env:LANGFUSE_OTLP_AUTH}
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/langfuse]
