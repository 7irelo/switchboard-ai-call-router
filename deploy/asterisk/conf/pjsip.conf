; Private network only. There is deliberately NO trunk and NO outbound route,
; which rules out toll fraud by construction.

; A REGISTER or INVITE from the softphone matches it by username first. Without this, Docker's
; port forwarding makes the phone look like an internal test caller.
[global]
type = global
endpoint_identifier_order = username,ip,anonymous

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060
; The compose network hands out container addresses from 172.30.0.128/25 only, so the bridge
; gateway (172.30.0.1), which forwarded traffic from the LAN appears to come from, counts as external.
local_net = 172.30.0.128/25
; Substituted at start from HOST_LAN_IP, so the softphone is told to send audio to this PC.
external_media_address = __HOST_LAN_IP__
external_signaling_address = __HOST_LAN_IP__

; Inbound test callers (SIPp), matched by source address on the compose network only.
[callers]
type = endpoint
context = inbound
disallow = all
allow = ulaw
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes

[callers-identify]
type = identify
endpoint = callers
match = 172.30.0.128/25

; A softphone app on your own phone (Linphone, Zoiper), on the same Wi-Fi as this PC.
; Username "phone", password PHONE_SIP_PASSWORD from .env. It can only reach the demo tenants.
[phone]
type = endpoint
context = phone
disallow = all
allow = ulaw,alaw
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
auth = phone-auth
aors = phone

[phone-auth]
type = auth
auth_type = userpass
username = phone
password = __PHONE_SIP_PASSWORD__

[phone]
type = aor
max_contacts = 1
remove_existing = yes
qualify_frequency = 30

; A staff phone for demos (a second softphone, signed in as "desk"). Every transfer rings it first, showing
; the department and the caller; if it isn't signed in, transfers go to the sink below.
[desk]
type = endpoint
context = no-return
disallow = all
allow = ulaw,alaw
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
auth = desk-auth
aors = desk

[desk-auth]
type = auth
auth_type = userpass
username = desk
password = __DESK_SIP_PASSWORD__

[desk]
type = aor
max_contacts = 1
remove_existing = yes
qualify_frequency = 30

; Department sink: a SIPp UAS that stands in for every department phone.
; The department is the SIP user part, so a test can assert on it.
[sink]
type = endpoint
context = no-return
disallow = all
allow = ulaw
direct_media = no
aors = sink-aor

[sink-aor]
type = aor
contact = sip:sink:5060
