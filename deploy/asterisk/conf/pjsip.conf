; Private network only. There is deliberately NO trunk and NO outbound route,
; which rules out toll fraud by construction.
[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

; Inbound test callers (SIPp, softphone), matched by source network.
[callers]
type = endpoint
context = inbound
disallow = all
allow = ulaw
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes

[callers-identify]
type = identify
endpoint = callers
match = 172.16.0.0/12
match = 10.0.0.0/8
match = 192.168.0.0/16

; Department sink: a SIPp UAS that stands in for every department phone.
; The department is the SIP user part, so a test can assert on it.
[sink]
type = endpoint
context = no-return
disallow = all
allow = ulaw
direct_media = no
aors = sink-aor

[sink-aor]
type = aor
contact = sip:sink:5060
