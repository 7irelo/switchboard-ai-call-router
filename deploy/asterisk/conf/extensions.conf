[general]
static = yes
writeprotect = yes

[inbound]
exten => _X.,1,NoOp(Switchboard inbound ${EXTEN})
 same => n,Stasis(switchboard,${EXTEN})
 same => n,Hangup()

; The gateway continues channels here with the department target as the extension.
; A target can only reach the sink endpoint: there is no other route.
[departments]
exten => _[a-z].,1,Dial(PJSIP/${EXTEN}@sink,20)
 same => n,Hangup()

[no-return]
exten => _X.,1,Hangup()
