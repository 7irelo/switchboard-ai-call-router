[general]
static = yes
writeprotect = yes

[inbound]
exten => _X.,1,NoOp(Switchboard inbound ${EXTEN})
 same => n,Stasis(switchboard,${EXTEN})
 same => n,Hangup()

; The softphone: short codes for the demo tenants, or dial a tenant's full number.
; Nothing here reaches a trunk, because there isn't one.
[phone]
; 101-105: the receptionist agent for each tenant.
exten => 101,1,Goto(inbound,27005550201,1) ; Thornveld Animal Hospital: Gemma
exten => 102,1,Goto(inbound,27005550202,1) ; Sandrivier Metro: Sienna
exten => 103,1,Goto(inbound,27005550203,1) ; Quillfibre: Colin
exten => 104,1,Goto(inbound,27005550204,1) ; Marula Ridge: Hannah
exten => 105,1,Goto(inbound,27005550205,1) ; Blue Aloe: Kit
; 111-115: the same tenants through the router only (fixed prompts, then a transfer).
exten => 111,1,Goto(inbound,27005550101,1)
exten => 112,1,Goto(inbound,27005550102,1)
exten => 113,1,Goto(inbound,27005550103,1)
exten => 114,1,Goto(inbound,27005550104,1)
exten => 115,1,Goto(inbound,27005550105,1)
exten => _270055501XX,1,Goto(inbound,${EXTEN},1)
exten => _270055502XX,1,Goto(inbound,${EXTEN},1)
; Echo test: you hear yourself, which proves audio works both ways.
exten => 600,1,Answer()
 same => n,Echo()
 same => n,Hangup()

; The gateway continues channels here with the department target as the extension.
; A target can only reach the sink endpoint: there is no other route.
[departments]
exten => _[a-z].,1,Dial(PJSIP/${EXTEN}@sink,20)
 same => n,Hangup()

[no-return]
exten => _X.,1,Hangup()
