[project]
name = "switchboard-inference"
version = "0.1.0"
description = "Inference service, data pipeline and evals for Switchboard"
requires-python = ">=3.12,<3.13"
dependencies = [
  "grpcio==1.76.0",
  "protobuf>=6.31,<7",
  "numpy>=2.1,<3",
  "pyyaml>=6,<7",
  "scikit-learn>=1.6,<2",
  "websockets>=15,<16",
  "anthropic>=0.70",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.1,<2"]
onnx = ["onnxruntime>=1.20,<2", "tokenizers>=0.20,<1"]
train = ["torch>=2.5", "transformers>=4.46", "datasets>=3", "accelerate>=1", "onnx>=1.17"]
otel = [
  "opentelemetry-sdk>=1.28,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.28,<2",
]

[dependency-groups]
dev = [
  "grpcio-tools==1.76.0",
  "pytest>=8,<9",
  "pytest-benchmark>=5,<6",
  "hypothesis>=2.0",
  "ruff>=0.8",
  "poethepoet>=0.31",
  "psycopg[binary]>=3.2,<4",
  "redis>=5,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/python/switchboard_inference"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
markers = [
  "live: spends money on external APIs, excluded from the default run",
  "stack: needs the Compose stack running",
]
addopts = "-m 'not live and not stack' -q"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["src/python/switchboard_inference/gen"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.poe.tasks]
proto = "python scripts/gen_proto.py"
lint = "ruff check src/python tests/python scripts"
test = "pytest"
clean-room = "python scripts/check_clean_room.py"
golden = "python scripts/gen_decision_vectors.py"
dotnet-test = "dotnet test src/dotnet/Switchboard.sln --nologo -v q"
fixtures = "python -m switchboard_inference.data.build --out data/fixture"
eval = "python -m switchboard_inference.eval.runner --data data/fixture --split dev --out runs/fixture"
gate = "python -m switchboard_inference.eval.gate --run runs/fixture/report.json --baseline configs/eval/baseline_fixture.json"
gate-self-test = "python -m switchboard_inference.eval.gate_selftest"
mutation = "python scripts/mutation_check.py"
stack-up = "docker compose -f deploy/compose.yaml --env-file .env up -d --build --wait"
stack-down = "docker compose -f deploy/compose.yaml --env-file .env down -v"
e2e = "python tests/e2e/run_e2e.py"
ci = ["clean-room", "proto", "lint", "test", "dotnet-test", "fixtures", "eval", "gate", "gate-self-test"]
